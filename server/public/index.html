<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정비 전산 (결제 연동 예제)</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#dfe3e8; --text:#1f2933; --sub:#667085; --blue:#2563eb; --green:#15803d; --red:#b91c1c; --amber:#b45309; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:14px/1.5 "Malgun Gothic", system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; display:grid; gap:12px; }
  h1 { font-size:18px; margin:0; } h2 { font-size:15px; margin:0 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .note { color:var(--sub); font-size:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input, select, button { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  input.num { width:110px; } input.qty { width:70px; } input.name { flex:1; min-width:140px; }
  button { cursor:pointer; } button.primary { background:var(--blue); color:#fff; border-color:var(--blue); }
  button:disabled { opacity:.45; cursor:default; }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--sub); font-weight:600; font-size:12px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:600; background:#eef2f7; }
  .b-PENDING_PAYMENT { background:#e0e7ff; color:#3730a3; } .b-PAID { background:#dcfce7; color:var(--green); }
  .b-REFUNDED { background:#e5e7eb; color:#374151; } .b-REVIEW { background:#fef3c7; color:var(--amber); }
  .ok { color:var(--green); } .bad { color:var(--red); } .warn { color:var(--amber); }
  #events { max-height:240px; overflow:auto; font:12px/1.6 Consolas, monospace; margin:0; padding:0; list-style:none; }
  #msg { min-height:20px; }
</style>
</head>
<body>
<main>
  <div class="card row">
    <h1>정비 전산 (결제 연동 예제)</h1>
    <span class="note">이 화면은 전산 내부 기능을 흉내 낸 것으로 이 PC 에서만 열려요. 운영에서는 전산의 실제 기능으로 대체하세요.</span>
  </div>

  <div class="card">
    <div class="row">
      <label>매장 <select id="shop"></select></label>
      <span id="conn"></span>
    </div>
    <div class="note" id="clients"></div>
    <div class="note" id="cfg"></div>
  </div>

  <div class="card">
    <h2>작업 만들기</h2>
    <div class="row"><input id="label" class="name" placeholder="작업 이름 (예: 12가3456 홍길동)"></div>
    <div id="items"></div>
    <div class="row" style="margin-top:8px">
      <button id="addRow" type="button">품목 줄 추가</button>
      <button id="create" class="primary" type="button">작업 만들기</button>
      <span id="msg" class="bad"></span>
    </div>
  </div>

  <div class="card">
    <h2>작업 목록</h2>
    <table>
      <thead><tr><th>번호</th><th>작업</th><th>품목</th><th>합계</th><th>상태</th><th>POS</th><th></th></tr></thead>
      <tbody id="orders"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>최근 이벤트 로그</h2>
    <ul id="events"></ul>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const STATUS = { PENDING_PAYMENT: '결제대기', PAID: '결제완료', REFUNDED: '취소(환불)', REVIEW: '확인 필요' };
const POS = { NONE: '아직 안 담음', QUEUED: '전달 대기', APPLIED: 'POS 에 담김', REMOVED: 'POS 에서 뺌', FAILED: '실패', EXPIRED: '만료' };
let state = null;
let shopId = null;

function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  for (const k of kids) e.append(k);
  return e;
}
const won = (n) => `${Number(n).toLocaleString('ko-KR')}원`;
const hhmmss = (ms) => new Date(ms).toLocaleTimeString('ko-KR', { hour12: false });

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || data.error || `오류 ${res.status}`);
  return data;
}

function addRow(name = '', price = '', qty = '1') {
  const row = el('div', { className: 'row item' },
    el('input', { className: 'name', placeholder: '품목 이름', value: name }),
    el('input', { className: 'num', type: 'number', min: 0, placeholder: '단가(원)', value: price }),
    el('input', { className: 'qty', type: 'number', min: 1, placeholder: '수량', value: qty }));
  row.style.marginTop = '6px';
  $('items').append(row);
}

async function act(path, body = {}) {
  $('msg').textContent = '';
  try { await api(path, body); } catch (e) { $('msg').textContent = e.message; }
  refresh();
}

function render() {
  const shops = state.shops;
  const sel = $('shop');
  if (sel.options.length !== shops.length) {
    sel.replaceChildren(...shops.map((s) => el('option', { value: s.id, textContent: `#${s.id} ${s.name}` })));
  }
  if (shopId === null || !shops.some((s) => s.id === shopId)) shopId = shops[0]?.id ?? null;
  sel.value = shopId;
  const shop = shops.find((s) => s.id === shopId);
  if (!shop) return;

  const active = shop.clients.find((c) => c.active && c.online);
  $('conn').replaceChildren(active
    ? el('span', { className: 'ok', textContent: `POS 연결됨 · ${active.transport === 'ws' ? 'WebSocket' : 'HTTP 폴링'}` })
    : el('span', { className: 'bad', textContent: 'POS 연결 안 됨' }));
  $('clients').textContent = shop.clients.length
    ? '단말: ' + shop.clients.map((c) => `${c.clientId.slice(0, 8)}(${c.online ? '온라인' : '오프라인'}${c.active ? ', 활성' : ''}${c.draft ? `, POS 장바구니 ${c.draft.lineCount}줄` : ''})`).join(' / ')
    : '단말: 아직 접속한 POS 가 없어요.';
  $('cfg').textContent = `토스 가맹점 ID: ${shop.merchantId || '(hello 로 아직 못 받음)'} · 웹훅 시크릿 ${state.tossWebhookConfigured ? '설정됨' : '없음'} · Open API 키 ${state.tossOpenApiConfigured ? '설정됨' : '없음'}`;

  $('orders').replaceChildren(...shop.workOrders.map((wo) => {
    const status = el('span', { className: `badge b-${wo.status}`, textContent: STATUS[wo.status] });
    const statusCell = el('td', {}, status);
    if (wo.reviewReason) statusCell.append(el('div', { className: 'warn note', textContent: wo.reviewReason }));
    const posCell = el('td', {}, POS[wo.posState] || wo.posState);
    if (wo.posError) posCell.append(el('div', { className: 'bad note', textContent: `POS 반영 실패: ${wo.posError}` }));
    const paid = wo.status === 'PAID';
    const btns = el('td', {},
      el('button', { textContent: '담기', disabled: paid, onclick: () => act(`/api/work-orders/${wo.id}/cart`, { startPayment: true }) }), ' ',
      el('button', { textContent: 'POS에서 빼기', disabled: paid, onclick: () => act(`/api/work-orders/${wo.id}/remove`) }));
    if (wo.status === 'REVIEW') btns.append(' ', el('button', { textContent: '결제완료로 처리', onclick: () => act(`/api/work-orders/${wo.id}/confirm-paid`) }));
    return el('tr', {},
      el('td', { textContent: `#${wo.id}` }), el('td', { textContent: wo.label }),
      el('td', { textContent: wo.lines.map((l) => `${l.title} ${l.quantity}개 × ${won(l.unitPrice)}`).join(', ') }),
      el('td', { textContent: won(wo.total) }), statusCell, posCell, btns);
  }));

  $('events').replaceChildren(...state.events.filter((e) => e.shopId === 0 || e.shopId === shopId).map((e) =>
    el('li', { className: e.level === 'error' ? 'bad' : e.level === 'warn' ? 'warn' : '', textContent: `${hhmmss(e.at)} ${e.text}` })));
}

async function refresh() {
  try { state = await api('/api/state'); render(); } catch (e) { $('msg').textContent = e.message; }
}

$('shop').onchange = () => { shopId = Number($('shop').value); render(); };
$('addRow').onclick = () => addRow();
$('create').onclick = async () => {
  const lines = [...document.querySelectorAll('.item')].map((r) => {
    const [n, p, q] = r.querySelectorAll('input');
    return { title: n.value, unitPrice: Number(p.value), quantity: Number(q.value) };
  });
  $('msg').textContent = '';
  try {
    await api('/api/work-orders', { shopId, label: $('label').value, lines });
    $('label').value = '';
    $('items').replaceChildren();
    addRow('엔진오일 교환', '69000', '1'); addRow('오일필터', '12000', '1'); addRow();
  } catch (e) { $('msg').textContent = e.message; }
  refresh();
};

addRow('엔진오일 교환', '69000', '1'); addRow('오일필터', '12000', '1'); addRow();
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
